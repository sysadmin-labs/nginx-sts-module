# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_STREAM  directives for a stream block, may be empty
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# The display answers out of a shared memory zone, and a zone is exactly the
# kind of thing a reload can lose: the name and the size have to match the
# previous cycle for nginx to keep it.  A reload that dropped the zone makes
# this module answer 503 -- which is what it did before the zone directive
# was there at all -- so the probe asks for the one thing only a live zone
# can produce.
#
# The zone is created in the stream block and found again from the http one,
# which is why both are needed here: with the stream half missing there is
# nothing to find and the probe would answer 503 from the first round, with
# or without a leak.

RELOAD_STREAM="
    server_traffic_status_zone;"

RELOAD_HTTP="
    stream_server_traffic_status_zone;"

RELOAD_SERVER="
        location /probe {
            stream_server_traffic_status_display;
            stream_server_traffic_status_display_format json;
        }"

RELOAD_EXPECT='streamServerZones'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe" |
		sed -n 's/.*"\(streamServerZones\)".*/\1/p'
}
